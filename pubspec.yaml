name: krishi_smart
description: Smart Agriculture Advisor for Nepali farmers — offline-first crop advice, disease detection, and weather.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  supabase_flutter: ^2.9.0
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.4
  flutter_dotenv: ^5.2.1
  cryptography: ^2.7.0
  connectivity_plus: ^6.1.4
  permission_handler: ^11.4.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  equatable: ^2.0.7
  logger: ^2.5.0
  http: ^1.3.0
  uuid: ^4.5.1
  shared_preferences: ^2.5.3
  lottie: ^3.3.1
  xml: ^6.5.0
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1
  indic_transliteration_dart: ^2.3.79
  fl_chart: ^0.69.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo/logo.png
  adaptive_icon_background: "#F5F7F2"
  adaptive_icon_foreground: assets/logo/logo.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/data/
    - assets/models/
    - assets/logo/
    - assets/animations/
